<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Umberto Case</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -webkit-appearance: none; margin: 0; outline: none; border: none; }
        .tab-active { background: #4f46e5; color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
        .exercise-card { transition: all 0.2s ease-in-out; }
        .gif-container { background: #f8fafc; border-radius: 1.5rem; overflow: hidden; height: 160px; position: relative; }
        .gif-container img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app"></div>

    <script>
        // --- DATABASE AGGIORNATO CON GIF (Link di esempio stabili) ---
        const defaultData = {
            routine: 'A', tab: 'workout', isEdit: false,
            workout: {
                A: {
                    name: "Routine A: Power & Thickness",
                    concept: "Focus sullo spessore del busto e forza esplosiva. Crea una base muscolare densa.",
                    warmup: "7' Tapis (Pendenza 5%) + Mobilità Spalle",
                    abs: "Leg Raises 3x15 + Plank 3x60s",
                    exs: [
                        { id: 'a1', n: 'Lento Avanti Manubri', s: '3x8-10', t: 'Spalle Anteriori', e: 'Scendi sotto le orecchie. Spingi senza toccare i pesi.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Shoulder-Press.gif' },
                        { id: 'a2', n: 'Lat Machine Pr. Larga', s: '3x10', t: 'V-Taper Spessore', e: 'Guida con i GOMITI. Strizza le scapole in fondo.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Lat-Pulldown.gif' },
                        { id: 'a3', n: 'Panca Piana Manubri', s: '3x10', t: 'Massa Petto', e: 'Strizza il petto come se volessi unire i bicipiti.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Press.gif' },
                        { id: 'a4', n: 'SS: Curl Bilanciere EZ', s: '4x10', t: 'Bicipiti Massa', e: 'Gomiti incollati. Spremi in alto per 1 secondo.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Z-Bar-Curl.gif' },
                        { id: 'a5', n: 'SS: French Press EZ', s: '4x10', t: 'Tricipiti Spessore', e: 'Porta alla fronte. Gomiti stretti e fermi.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/EZ-Bar-Lying-Triceps-Extension.gif' },
                        { id: 'a6', n: 'Alzate Laterali', s: '3x15', t: 'Larghezza Spalle', e: 'Mignolo in su. Non superare la linea spalle.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Lateral-Raise.gif' },
                        { id: 'a7', n: 'Facepull ai Cavi', s: '3x12', t: 'Dettaglio Posteriore', e: 'Tira la corda verso la fronte aprendo i gomiti.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Face-Pull.gif' }
                    ]
                },
                B: {
                    name: "Routine B: Width & Definition",
                    concept: "Focus sull ampiezza laterale (V-Shape) e isolamento braccia. Tensione costante.",
                    warmup: "7' Tapis + Mobilità cuffia rotatori",
                    abs: "Woodchopper 3x15 + Bicycle 3x20",
                    exs: [
                        { id: 'b1', n: 'Trazioni o Lat Stretta', s: '3xMax/10', t: 'Ampiezza Dorsale', e: 'Allunga bene in alto. Petto verso la sbarra.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Pull-up.gif' },
                        { id: 'b2', n: 'Panca Inclinata Man.', s: '3x10', t: 'Focus Petto Alto', e: 'Panca 30 gradi. Look pieno sotto le clavicole.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Incline-Dumbbell-Press.gif' },
                        { id: 'b3', n: 'Alzate Laterali Cavi', s: '3x12', t: 'Tensione Spalle', e: 'Cavo dietro la schiena. Isola il deltoide.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Cable-Lateral-Raise.gif' },
                        { id: 'b4', n: 'SS: Hammer Curl', s: '4x12', t: 'Spessore Brachiale', e: 'Presa a martello. Allarga il braccio lateralmente.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Hammer-Curl.gif' },
                        { id: 'b5', n: 'SS: Pushdown Corda', s: '4x12', t: 'Dettaglio Tricipiti', e: 'Apri la corda in fondo. Strizza il tricipite.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Rope-Pushdown.gif' },
                        { id: 'b6', n: 'Curl Panca Inc. 45°', s: '2x12', t: 'Picco Bicipite', e: 'Braccia dietro il busto. Massimo stretch.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Incline-Dumbbell-Curl.gif' },
                        { id: 'b7', n: 'Dips Panche/Parall.', s: '3xMax', t: 'Finisher Braccia', e: 'Gomiti stretti. Scendi finchè l omero è parallelo.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Bench-Dips.gif' }
                    ]
                }
            },
            weights: {},
            diet: [
                { t: "Colazione", v: [
                    { d: "80g Avena + 150g Albume + 1 Uovo + 50g Mirtilli", k: 515, p: 32 },
                    { d: "250g Yogurt Greco (2%) + 50g Granola + 20g Noci", k: 490, p: 30 },
                    { d: "80g Pane integrale + 100g Bresaola + 50g Avocado", k: 510, p: 35 }
                ]},
                { t: "Pranzo", v: [
                    { d: "100g Riso Basmati + 150g Pollo + 200g Zucchine + 15g Olio EVO", k: 690, p: 40 },
                    { d: "100g Pasta integrale + 150g Manzo magro + 10g Olio EVO", k: 720, p: 38 },
                    { d: "100g Quinoa + 150g Tonno (nat.) + 200g Verdure + 15g Olio EVO", k: 660, p: 39 }
                ]},
                { t: "Spuntino", v: [
                    { d: "1 Barretta Proteica (60g) + 1 Mela (150g)", k: 285, p: 20 },
                    { d: "40g Parmigiano Reggiano + 1 Pera (150g)", k: 260, p: 13 },
                    { d: "170g Skyr Bianco + 20g Mandorle", k: 275, p: 22 }
                ]},
                { t: "Cena", v: [
                    { d: "150g Salmone + 250g Patate + 200g Asparagi + 5g Olio EVO", k: 650, p: 36 },
                    { d: "200g Orata + 80g Couscous + 200g Broccoli + 15g Olio EVO", k: 620, p: 42 },
                    { d: "150g Tacchino + 80g Pane integrale + Insalata + 15g Olio EVO", k: 600, p: 38 }
                ]}
            ]
        };

        let state = JSON.parse(localStorage.getItem('aesthetic_v10')) || defaultData;
        function save() { localStorage.setItem('aesthetic_v10', JSON.stringify(state)); render(); }

        const iconGym = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 3 10l3.5 3.5m11-7L21 10l-3.5 3.5"/><path d="m18 7-11 10"/><path d="m14 7 3.5 3.5-3.5 3.5"/><path d="m6.5 6.5 3.5 3.5-3.5 3.5"/></svg>`;
        const iconFood = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`;
        const iconEdit = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

        function render() {
            const app = document.getElementById('app');
            const r = state.workout[state.routine];

            let html = `
                <header class="bg-indigo-700 p-6 text-white rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50 flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Umberto Case</h1>
                        <p class="text-[9px] font-bold opacity-60 uppercase tracking-[0.2em] mt-1">Piano personalizzato</p>
                    </div>
                    <button onclick="state.isEdit = !state.isEdit; save()" class="p-3 rounded-full ${state.isEdit ? 'bg-amber-400 rotate-90 shadow-lg' : 'bg-white/10'} transition-all">
                        ${iconEdit}
                    </button>
                </header>
                <main class="p-4 max-w-md mx-auto space-y-6">
            `;

            if (state.tab === 'workout') {
                html += `
                    <div class="flex bg-white p-1 rounded-2xl shadow-inner border border-slate-200">
                        <button onclick="state.routine='A'; save()" class="flex-1 py-3 rounded-xl font-bold text-xs ${state.routine === 'A' ? 'tab-active' : 'text-slate-400'}">ROUTINE A</button>
                        <button onclick="state.routine='B'; save()" class="flex-1 py-3 rounded-xl font-bold text-xs ${state.routine === 'B' ? 'tab-active' : 'text-slate-400'}">ROUTINE B</button>
                    </div>

                    <div class="bg-indigo-600 p-6 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                        <p class="text-[10px] font-black opacity-50 uppercase tracking-widest mb-1 italic">The Concept</p>
                        <p class="text-xs font-bold leading-relaxed italic pr-8">"${r.concept}"</p>
                    </div>

                    <div class="bg-amber-100 border border-amber-200 p-5 rounded-[2rem] flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></div>
                        <p class="text-xs font-black text-amber-900 leading-tight tracking-tight uppercase">${r.warmup}</p>
                    </div>

                    <div class="space-y-8">
                        ${r.exs.map(ex => `
                            <div class="exercise-card bg-white p-2 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                <div class="gif-container mb-4">
                                    <img src="${ex.g}" loading="lazy" alt="${ex.n}">
                                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-2 rounded-2xl shadow-lg border border-slate-100">
                                        <input type="number" onchange="state.weights['${ex.id}']=this.value; save()" 
                                               class="w-12 text-center font-black text-indigo-600 bg-transparent text-sm" 
                                               value="${state.weights[ex.id] || ''}" placeholder="KG">
                                    </div>
                                </div>
                                <div class="px-4 pb-4">
                                    <div class="flex justify-between items-center mb-2">
                                        <h4 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${ex.n}</h4>
                                        <span class="text-indigo-600 text-[10px] font-black bg-indigo-50 px-2 py-0.5 rounded-full uppercase tracking-tighter">${ex.s}</span>
                                    </div>
                                    <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-1 tracking-widest">Coach Tip:</p>
                                        <p class="text-[10px] text-slate-600 font-bold leading-snug">${ex.e}</p>
                                    </div>
                                    ${state.isEdit ? `<input onchange="editEx('${ex.id}', 'g', this.value)" class="w-full text-[8px] mt-2 p-1 border rounded" value="${ex.g}" placeholder="GIF URL">` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-indigo-900 p-6 rounded-[2.5rem] shadow-2xl">
                        <p class="text-[9px] font-black text-indigo-400 uppercase mb-2 tracking-[0.2em] text-center italic font-bold">V-Shape Finisher</p>
                        <p class="text-xs font-black text-white text-center leading-relaxed italic">"${r.abs}"</p>
                    </div>
                `;
            } else {
                html += `
                    <div class="bg-emerald-600 p-8 rounded-[3rem] text-white shadow-2xl flex flex-col items-center text-center">
                        <p class="text-[10px] font-black opacity-70 tracking-[0.2em] mb-1 uppercase italic">Diet Strategy</p>
                        <h2 class="text-4xl font-black italic tracking-tighter uppercase">2400 <span class="text-xl font-normal opacity-70">Kcal</span></h2>
                        <div class="flex gap-4 mt-3">
                            <span class="text-[10px] font-black bg-white/20 px-3 py-1.5 rounded-full uppercase tracking-widest border border-white/20">Pro: 125g</span>
                            <span class="text-[10px] font-black bg-white/20 px-3 py-1.5 rounded-full uppercase tracking-widest border border-white/20">Fat: 65g</span>
                        </div>
                    </div>
                    ${state.diet.map(m => `
                        <div class="bg-white p-7 rounded-[3rem] border border-slate-100 shadow-sm">
                            <h4 class="text-[11px] font-black text-slate-300 uppercase tracking-widest mb-5 border-b border-slate-50 pb-2">${m.t}</h4>
                            <div class="space-y-4">
                                ${m.v.map((v, idx) => `
                                    <div class="p-5 bg-slate-50 rounded-[2rem] border border-slate-100 relative overflow-hidden">
                                        <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-300"></div>
                                        <p class="text-xs font-black text-slate-700 leading-snug mb-3">${v.d}</p>
                                        <div class="flex gap-3">
                                            <span class="text-[9px] font-black bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg uppercase">${v.k} KCAL</span>
                                            <span class="text-[9px] font-black bg-indigo-100 text-indigo-700 px-2 py-1 rounded-lg uppercase">P: ${v.p}G</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            }

            html += `
                </main>
                <nav class="fixed bottom-6 left-6 right-6 bg-white/95 backdrop-blur-xl border border-slate-200 h-20 rounded-[2.5rem] shadow-2xl flex justify-around items-center px-4 z-[100]">
                    <button onclick="state.tab='workout'; save()" class="flex-1 flex flex-col items-center ${state.tab === 'workout' ? 'text-indigo-600 scale-110' : 'text-slate-300'}">
                        ${iconGym} <span class="text-[9px] font-black uppercase mt-1">Power</span>
                    </button>
                    <button onclick="state.tab='diet'; save()" class="flex-1 flex flex-col items-center ${state.tab === 'diet' ? 'text-emerald-600 scale-110' : 'text-slate-300'}">
                        ${iconFood} <span class="text-[9px] font-black uppercase mt-1">Fuel</span>
                    </button>
                </nav>
            `;

            app.innerHTML = html;
        }

        window.editEx = (id, field, val) => {
            const ex = [...state.workout.A.exs, ...state.workout.B.exs].find(e => e.id === id);
            if (ex) ex[field] = val;
            save();
        };

        render();
    </script>
</body>
</html>
