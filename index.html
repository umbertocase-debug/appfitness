<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Master v9</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -webkit-appearance: none; margin: 0; border: none; outline: none; }
        .tab-active { background: #4f46e5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app"></div>

    <script>
        const defaultData = {
            routine: 'A',
            tab: 'workout',
            isEdit: false,
            workout: {
                A: {
                    name: "Routine A: Power & Thickness",
                    concept: "Focus sullo spessore del busto e sulla forza esplosiva. Usiamo carichi alti per creare una base muscolare densa.",
                    warmup: "7' Tapis (Pendenza 5%) + Circonduzioni braccia + 2 serie leggere del primo esercizio.",
                    abs: "Leg Raises 3x15 (Arrotola il bacino) + Plank 3x60s (Spremi i glutei).",
                    exs: [
                        { id: 'a1', n: 'Lento Avanti Manubri', s: '3x8-10', t: 'Focus Spalle Anteriori', e: 'Siediti dritto. Scendi coi manubri fin sotto le orecchie. Spingi verso l alto senza far toccare i pesi. NON inarcare eccessivamente la schiena.' },
                        { id: 'a2', n: 'Lat Machine Pr. Larga', s: '3x10', t: 'Focus V-Taper Spessore', e: 'Tira la sbarra al petto. Immagina di guidare il movimento con i GOMITI, non con le mani. Strizza le scapole in fondo.' },
                        { id: 'a3', n: 'Panca Piana Manubri', s: '3x10', t: 'Focus Massa Petto', e: 'Scendi lentamente sentendo lo stretch. In risalita, strizza il petto come se volessi unire i bicipiti. Piedi ben piantati a terra.' },
                        { id: 'a4', n: 'SS: Curl Bilanciere EZ', s: '4x10', t: 'Bicipiti Massa', e: 'Gomiti incollati ai fianchi. NON oscillare con la schiena. Spremi il bicipite nel punto più alto del movimento.' },
                        { id: 'a5', n: 'SS: French Press EZ', s: '4x10', t: 'Tricipiti Spessore', e: 'Porta il bilanciere verso la fronte. Tieni i gomiti stretti e fermi nello spazio. Estendi completamente il braccio.' },
                        { id: 'a6', n: 'Alzate Laterali', s: '3x15', t: 'Larghezza Spalle', e: 'Mignolo leggermente verso l alto. Non superare la linea delle spalle. Movimento a pendolo controllato, no slanci.' },
                        { id: 'a7', n: 'Facepull ai Cavi', s: '3x12', t: 'Dettaglio Posteriore', e: 'Tira la corda verso la fronte aprendola verso l esterno. Utile per la postura da ufficio e spalle tonde.' }
                    ]
                },
                B: {
                    name: "Routine B: Width & Definition",
                    concept: "Focus sull ampiezza laterale (V-Shape) e isolamento delle braccia. Tensione costante per scolpire i dettagli.",
                    warmup: "7' Tapis + Mobilità cuffia dei rotatori con elastico o pesetti da 1kg.",
                    abs: "Woodchopper Cavi 3x15 (Taglia legna diagonale) + Bicycle Crunch 3x20.",
                    exs: [
                        { id: 'b1', n: 'Trazioni o Lat Stretta', s: '3xMax/10', t: 'Ampiezza Dorsale', e: 'Cerca il massimo allungamento in alto. Tira portando il petto verso la sbarra. Fondamentale per allargare la schiena.' },
                        { id: 'b2', n: 'Panca Inclinata Man.', s: '3x10', t: 'Focus Petto Alto', e: 'Inclinazione panca 30 gradi. Spingi verso l alto e verso l interno. Questo crea il look pieno sotto le clavicole.' },
                        { id: 'b3', n: 'Alzate Laterali Cavi', s: '3x12', t: 'Tensione Costante Spalle', e: 'Cavo basso. Passa il braccio dietro la schiena per aumentare lo stretch. Non sollevare la scapola, isola il deltoide.' },
                        { id: 'b4', n: 'SS: Hammer Curl', s: '4x12', t: 'Spessore Brachiale', e: 'Presa a martello (palmi che si guardano). Questo allarga il braccio lateralmente. Fondamentale per la circonferenza.' },
                        { id: 'b5', n: 'SS: Pushdown Corda', s: '4x12', t: 'Dettaglio Tricipiti', e: 'Gomiti bloccati. In fondo al movimento "apri" la corda verso l esterno. Strizza il tricipite per 1 secondo.' },
                        { id: 'b6', n: 'Curl Panca Inc. 45°', s: '2x12', t: 'Picco Bicipite', e: 'Lascia cadere le braccia dietro il busto. Questo allunga il bicipite al massimo. Non muovere i gomiti durante il curl.' },
                        { id: 'b7', n: 'Dips Panche/Parall.', s: '3xMax', t: 'Finisher Braccia/Petto', e: 'Gomiti stretti per focus tricipiti. Scendi finchè l omero è parallelo al suolo e risali esplosivo.' }
                    ]
                }
            },
            weights: {},
            diet: [
                { t: "Colazione", v: [
                    { d: "80g Avena + 150g Albume + 1 Uovo + 50g Mirtilli", k: 515, p: 32 },
                    { d: "250g Yogurt Greco (2%) + 50g Granola + 20g Noci", k: 490, p: 30 },
                    { d: "80g Pane integrale + 100g Bresaola + 50g Avocado", k: 510, p: 35 }
                ]},
                { t: "Pranzo", v: [
                    { d: "100g Riso Basmati + 150g Pollo + 200g Zucchine + 15g Olio EVO", k: 690, p: 40 },
                    { d: "100g Pasta integrale + 150g Manzo magro + 10g Olio EVO", k: 720, p: 38 },
                    { d: "100g Quinoa + 150g Tonno (nat.) + 200g Verdure + 15g Olio EVO", k: 660, p: 39 }
                ]},
                { t: "Spuntino", v: [
                    { d: "1 Barretta Proteica (60g) + 1 Mela (150g)", k: 285, p: 20 },
                    { d: "40g Parmigiano Reggiano + 1 Pera (150g)", k: 260, p: 13 },
                    { d: "170g Skyr Bianco + 20g Mandorle", k: 275, p: 22 }
                ]},
                { t: "Cena", v: [
                    { d: "150g Salmone + 250g Patate + 200g Asparagi + 5g Olio EVO", k: 650, p: 36 },
                    { d: "200g Orata + 80g Couscous + 200g Broccoli + 15g Olio EVO", k: 620, p: 42 },
                    { d: "150g Tacchino + 80g Pane integrale + Insalata + 15g Olio EVO", k: 600, p: 38 }
                ]}
            ]
        };

        let state = JSON.parse(localStorage.getItem('aesthetic_v9')) || defaultData;
        function save() { localStorage.setItem('aesthetic_v9', JSON.stringify(state)); render(); }

        const iconGym = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 3 10l3.5 3.5m11-7L21 10l-3.5 3.5"/><path d="m18 7-11 10"/><path d="m14 7 3.5 3.5-3.5 3.5"/><path d="m6.5 6.5 3.5 3.5-3.5 3.5"/></svg>`;
        const iconFood = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`;
        const iconEdit = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

        function render() {
            const app = document.getElementById('app');
            const r = state.workout[state.routine];

            let html = `
                <header class="bg-indigo-800 p-6 text-white rounded-b-[2.5rem] shadow-2xl sticky top-0 z-50 flex justify-between items-center border-b border-indigo-400/20">
                    <div>
                        <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">AESTHETIC MASTER</h1>
                        <p class="text-[9px] font-bold opacity-60 uppercase tracking-[0.2em] mt-1 italic">V-SHAPE PROTOCOL V9</p>
                    </div>
                    <button onclick="state.isEdit = !state.isEdit; save()" class="p-3 rounded-full ${state.isEdit ? 'bg-amber-400 rotate-90 shadow-lg' : 'bg-white/10'} transition-all">
                        ${iconEdit}
                    </button>
                </header>
                <main class="p-4 max-w-md mx-auto space-y-6">
            `;

            if (state.tab === 'workout') {
                html += `
                    <div class="flex bg-white p-1.5 rounded-2xl shadow-inner border border-slate-200">
                        <button onclick="state.routine='A'; save()" class="flex-1 py-3 rounded-xl font-bold text-[10px] tracking-widest ${state.routine === 'A' ? 'tab-active' : 'text-slate-400'} uppercase">ROUTINE A</button>
                        <button onclick="state.routine='B'; save()" class="flex-1 py-3 rounded-xl font-bold text-[10px] tracking-widest ${state.routine === 'B' ? 'tab-active' : 'text-slate-400'} uppercase">ROUTINE B</button>
                    </div>

                    <div class="bg-indigo-600 p-6 rounded-[2.5rem] text-white shadow-xl">
                        <p class="text-[10px] font-black opacity-60 uppercase tracking-widest mb-1 italic">Scientific Concept</p>
                        ${state.isEdit ? `<textarea onchange="state.workout['${state.routine}'].concept=this.value; save()" class="w-full bg-white/10 text-xs p-2 rounded border-none text-white">${r.concept}</textarea>` : `<p class="text-xs font-bold leading-relaxed italic">"${r.concept}"</p>`}
                    </div>

                    <div class="bg-amber-100 border border-amber-200 p-5 rounded-3xl">
                        <p class="text-[9px] font-black text-amber-600 uppercase mb-1 tracking-widest"> Warmup Phase</p>
                        ${state.isEdit ? `<input onchange="state.workout['${state.routine}'].warmup=this.value; save()" class="w-full text-xs p-2 rounded border" value="${r.warmup}">` : `<p class="text-xs font-bold text-amber-900 leading-tight">${r.warmup}</p>`}
                    </div>

                    <div class="space-y-6 px-1">
                        ${r.exs.map(ex => `
                            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 card-shadow transition-all active:scale-[0.98]">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex-1">
                                        ${state.isEdit ? `
                                            <input onchange="editEx('${ex.id}', 'n', this.value)" class="w-full font-black text-xs mb-1 p-1 border-b" value="${ex.n}">
                                            <input onchange="editEx('${ex.id}', 's', this.value)" class="w-full text-indigo-600 text-[10px] font-bold p-1 border-b" value="${ex.s}">
                                            <input onchange="editEx('${ex.id}', 't', this.value)" class="w-full text-indigo-400 text-[9px] p-1 border-b" value="${ex.t}">
                                            <textarea onchange="editEx('${ex.id}', 'e', this.value)" class="w-full text-[9px] text-slate-500 p-1 h-12 mt-1" value="${ex.e}">${ex.e}</textarea>
                                        ` : `
                                            <h4 class="font-black text-slate-800 text-sm uppercase leading-tight mb-1">${ex.n}</h4>
                                            <div class="flex items-center gap-2">
                                                <span class="text-indigo-600 text-[10px] font-black uppercase tracking-wider">${ex.s}</span>
                                                <span class="bg-indigo-50 text-indigo-400 text-[8px] px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter">${ex.t}</span>
                                            </div>
                                        `}
                                    </div>
                                    ${!state.isEdit ? `
                                        <input type="number" onchange="state.weights['${ex.id}']=this.value; save()" 
                                               class="w-14 h-12 bg-slate-100 rounded-2xl text-center font-black text-indigo-600 outline-none border-2 border-transparent focus:border-indigo-600 transition-all shadow-inner" 
                                               value="${state.weights[ex.id] || ''}" placeholder="KG">
                                    ` : ''}
                                </div>
                                ${!state.isEdit ? `
                                    <div class="mt-4 p-4 bg-slate-50 rounded-2xl border border-slate-100 relative">
                                        <div class="absolute -top-2 left-4 px-2 bg-white border border-slate-100 text-[8px] font-black text-indigo-400 uppercase tracking-widest">Coach Execution Tips</div>
                                        <p class="text-[10px] text-slate-500 font-bold leading-relaxed">${ex.e}</p>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-indigo-900 p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-white/5 rounded-full -mr-8 -mt-8"></div>
                        <p class="text-[9px] font-black text-indigo-300 uppercase mb-2 tracking-[0.2em] text-center italic">Addominali V-Shape (The Finisher)</p>
                        ${state.isEdit ? `<input onchange="state.workout['${state.routine}'].abs=this.value; save()" class="w-full text-xs p-2 rounded bg-indigo-800 text-white border-none" value="${r.abs}">` : `<p class="text-xs font-black text-white text-center leading-relaxed">${r.abs}</p>`}
                    </div>
                `;
            } else {
                html += `
                    <div class="bg-emerald-600 p-8 rounded-[3rem] text-white shadow-2xl flex flex-col items-center text-center relative overflow-hidden">
                        <div class="absolute -left-10 -top-10 w-32 h-32 bg-white/10 rounded-full"></div>
                        <p class="text-[10px] font-black opacity-70 tracking-[0.3em] mb-1 uppercase font-bold italic">Nutrizione Strategica</p>
                        <h2 class="text-4xl font-black italic tracking-tighter uppercase leading-none">2400 <span class="text-xl font-normal opacity-70">Kcal</span></h2>
                        <div class="flex gap-4 mt-4">
                            <span class="text-[10px] font-black bg-white/20 px-4 py-1.5 rounded-full uppercase tracking-widest border border-white/20 shadow-lg">Pro: 125g</span>
                            <span class="text-[10px] font-black bg-white/20 px-4 py-1.5 rounded-full uppercase tracking-widest border border-white/20 shadow-lg">Fat: 65g</span>
                        </div>
                    </div>
                    ${state.diet.map(m => `
                        <div class="bg-white p-7 rounded-[3rem] border border-slate-100 shadow-sm relative">
                            <div class="flex items-center gap-3 mb-5 border-b border-slate-50 pb-3">
                                <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
                                <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest leading-none">${m.t}</h4>
                            </div>
                            <div class="space-y-4">
                                ${m.v.map((v, idx) => `
                                    <div class="p-5 bg-slate-50 rounded-[2rem] border border-slate-100 relative overflow-hidden transition-all active:scale-[0.98]">
                                        <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-300"></div>
                                        <p class="text-xs font-black text-slate-700 leading-snug mb-3 pl-1">${v.d}</p>
                                        <div class="flex gap-3 pl-1">
                                            <div class="flex flex-col">
                                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Energia</span>
                                                <span class="text-[10px] font-black text-emerald-600 uppercase">${v.k} KCAL</span>
                                            </div>
                                            <div class="flex flex-col border-l border-slate-200 pl-3">
                                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">Proteine</span>
                                                <span class="text-[10px] font-black text-indigo-600 uppercase">${v.p}G</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            }

            html += `
                </main>
                <nav class="fixed bottom-8 left-8 right-8 bg-white/95 backdrop-blur-xl border border-slate-200 h-20 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.15)] flex justify-around items-center px-6 z-[100]">
                    <button onclick="state.tab='workout'; save()" class="flex-1 flex flex-col items-center transition-all ${state.tab === 'workout' ? 'text-indigo-600 scale-110' : 'text-slate-300'}">
                        ${iconGym} <span class="text-[9px] font-black uppercase tracking-tighter mt-1">Power</span>
                    </button>
                    <button onclick="state.tab='diet'; save()" class="flex-1 flex flex-col items-center transition-all ${state.tab === 'diet' ? 'text-emerald-600 scale-110' : 'text-slate-300'}">
                        ${iconFood} <span class="text-[9px] font-black uppercase tracking-tighter mt-1">Fuel</span>
                    </button>
                </nav>
            `;

            app.innerHTML = html;
        }

        window.editEx = (id, field, val) => {
            const ex = state.workout[state.routine].exs.find(e => e.id === id);
            if (ex) ex[field] = val;
            save();
        };

        render();
    </script>
</body>
</html>
