<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Gym App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Componente Icona Semplice per evitare crash
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('workout');
            const [activeRoutine, setActiveRoutine] = useState('A');
            const [history, setHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('gymProgress_v3');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });

            useEffect(() => {
                localStorage.setItem('gymProgress_v3', JSON.stringify(history));
                if (window.lucide) window.lucide.createIcons();
            }, [history, activeTab, activeRoutine]);

            const routines = {
                A: {
                    title: "Routine A: Massa & Spessore",
                    concept: "Costruiamo le fondamenta. Focus su carichi pesanti e movimenti multiarticolari per dare spessore a busto e braccia.",
                    tips: ["Recupero 90''", "Eccentrica lenta (3s)", "Progressione carichi"],
                    exercises: [
                        { id: 'lento', name: 'Lento Avanti Manubri', sets: '3x8-10', tip: 'Spalle: scendi fin sotto le orecchie.' },
                        { id: 'lat', name: 'Lat Machine Presa Larga', sets: '3x10', tip: 'Tira con i gomiti, non con le mani.' },
                        { id: 'panca', name: 'Panca Piana Manubri', sets: '3x10', tip: 'Strizza il petto in fase di risalita.' },
                        { id: 'ss1', name: 'SS: Curl EZ + French Press', sets: '4x10+10', tip: 'Nessuna pausa! Focus braccia.' },
                        { id: 'alz_lat', name: 'Alzate Laterali', sets: '3x15', tip: 'Mignolo verso l alto.' }
                    ]
                },
                B: {
                    title: "Routine B: Ampiezza & V-Shape",
                    concept: "Focus estetico. Allarghiamo il dorso (V-Shape) e colpiamo i muscoli da angoli diversi per il massimo dettaglio.",
                    tips: ["Focus mente-muscolo", "Recupero 60''", "Tensione costante"],
                    exercises: [
                        { id: 'traz', name: 'Trazioni o Lat Stretta', sets: '3xMax/10', tip: 'Fondamentale per la V.' },
                        { id: 'inc', name: 'Panca Inclinata Manubri', sets: '3x10', tip: 'Focus sulla parte alta del petto.' },
                        { id: 'ss2', name: 'SS: Hammer Curl + Pushdown', sets: '4x12+12', tip: 'Braccia larghe e piene.' },
                        { id: 'cavi', name: 'Alzate Laterali ai Cavi', sets: '3x12', tip: 'Spalle a palla di cannone.' },
                        { id: 'curl45', name: 'Curl Panca Inclinata 45°', sets: '2x12', tip: 'Massimo stretch del bicipite.' }
                    ]
                }
            };

            const nutrition = [
                { time: "Colazione", options: ["80g Avena + 150g Albume + 1 uovo", "250g Yogurt Greco 2% + 50g Granola", "Pane tostato + 100g Bresaola + Avocado"] },
                { time: "Pranzo", options: ["100g Riso + 150g Pollo + Olio", "100g Pasta + 150g Macinato Magro", "100g Quinoa + 150g Tonno + Olio"] },
                { time: "Spuntino", options: ["1 Barretta Proteica + 1 Mela", "30g Parmigiano + 1 Pera", "150g Skyr + Mandorle"] },
                { time: "Cena", options: ["150g Salmone + 200g Patate", "200g Orata + 80g CousCous", "150g Tacchino + 60g Pane + Verdura"] }
            ];

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-indigo-700 p-8 text-white shadow-lg rounded-b-[2.5rem]">
                        <h1 className="text-3xl font-black tracking-tight uppercase">Aesthetic</h1>
                        <p className="opacity-80 text-xs font-bold tracking-widest mt-1">THE V-SHAPE PROTOCOL</p>
                    </header>

                    <main className="p-4 max-w-md mx-auto -mt-6">
                        {activeTab === 'workout' && (
                            <div className="space-y-6">
                                <div className="flex bg-white p-1.5 rounded-2xl shadow-md border border-slate-200">
                                    <button onClick={() => setActiveRoutine('A')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${activeRoutine === 'A' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>Routine A</button>
                                    <button onClick={() => setActiveRoutine('B')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${activeRoutine === 'B' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400'}`}>Routine B</button>
                                </div>

                                <div className="bg-indigo-600 p-5 rounded-3xl text-white shadow-lg">
                                    <h3 className="font-bold text-xs uppercase tracking-widest mb-2 flex items-center gap-2">
                                        <Icon name="target" size={14} /> Concept
                                    </h3>
                                    <p className="text-sm leading-relaxed opacity-90">{routines[activeRoutine].concept}</p>
                                    <div className="mt-4 flex flex-wrap gap-2">
                                        {routines[activeRoutine].tips.map((t, i) => (
                                            <span key={i} className="text-[9px] bg-white/20 px-2 py-1 rounded-lg font-bold uppercase tracking-tighter">✓ {t}</span>
                                        ))}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    {routines[activeRoutine].exercises.map((ex) => (
                                        <div key={ex.id} className="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <h3 className="font-black text-slate-800 uppercase text-md leading-tight">{ex.name}</h3>
                                                    <span className="text-indigo-600 text-[10px] font-black uppercase tracking-widest">{ex.sets}</span>
                                                </div>
                                                <input 
                                                    type="number" 
                                                    placeholder="KG"
                                                    className="w-16 bg-slate-100 border-none rounded-xl p-3 text-center font-black text-indigo-600 focus:ring-2 focus:ring-indigo-500 transition-all outline-none"
                                                    value={history[ex.id] || ''}
                                                    onChange={(e) => setHistory({...history, [ex.id]: e.target.value})}
                                                />
                                            </div>
                                            <div className="bg-slate-50 p-3 rounded-2xl flex items-start gap-2 border border-slate-100">
                                                <Icon name="info" size={12} className="text-indigo-400 mt-0.5" />
                                                <p className="text-[10px] text-slate-500 font-bold uppercase leading-tight">{ex.tip}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'nutrition' && (
                            <div className="space-y-6 animate-in fade-in">
                                <div className="bg-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                                    <p className="text-[10px] uppercase font-black tracking-widest opacity-80">Target Ricomposizione</p>
                                    <h2 className="text-3xl font-black">2400 <span className="text-sm font-normal">kcal</span></h2>
                                </div>
                                {nutrition.map((meal, i) => (
                                    <div key={i} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                        <h4 className="font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                                            <Icon name="utensils" size={14} className="text-emerald-500" /> {meal.time}
                                        </h4>
                                        <div className="space-y-2">
                                            {meal.options.map((opt, idx) => (
                                                <div key={idx} className="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-xs font-bold text-slate-700">
                                                    <span className="text-emerald-500 mr-2">{idx+1}.</span> {opt}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'progress' && (
                            <div className="bg-white p-10 rounded-[3rem] shadow-sm border border-slate-100 text-center space-y-6">
                                <div className="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto text-indigo-600">
                                    <Icon name="trending-up" size={40} />
                                </div>
                                <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tighter">Goal: 64KG</h2>
                                <p className="text-xs text-slate-400 font-bold uppercase tracking-widest italic">"Consistency beats perfection"</p>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-6 left-6 right-6 bg-white/90 backdrop-blur-lg border border-slate-200 h-20 flex items-center justify-around shadow-2xl rounded-[2.5rem] px-4 z-50">
                        <button onClick={() => setActiveTab('workout')} className={`flex flex-col items-center gap-1 ${activeTab === 'workout' ? 'text-indigo-600' : 'text-slate-300'}`}>
                            <Icon name="dumbbell" size={24} />
                            <span className="text-[9px] font-black uppercase">Power</span>
                        </button>
                        <button onClick={() => setActiveTab('nutrition')} className={`flex flex-col items-center gap-1 ${activeTab === 'nutrition' ? 'text-emerald-600' : 'text-slate-300'}`}>
                            <Icon name="utensils" size={24} />
                            <span className="text-[9px] font-black uppercase">Fuel</span>
                        </button>
                        <button onClick={() => setActiveTab('progress')} className={`flex flex-col items-center gap-1 ${activeTab === 'progress' ? 'text-indigo-600' : 'text-slate-300'}`}>
                            <Icon name="trending-up" size={24} />
                            <span className="text-[9px] font-black uppercase">Goal</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
