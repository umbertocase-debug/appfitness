<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Gym App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Dumbbell, Utensils, TrendingUp, Info } = lucide;

        const App = () => {
            const [activeTab, setActiveTab] = useState('workout');
            const [activeRoutine, setActiveRoutine] = useState('A');
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('gymProgress');
                return saved ? JSON.parse(saved) : {};
            });

            useEffect(() => {
                localStorage.setItem('gymProgress', JSON.stringify(history));
                lucide.createIcons(); // Inizializza icone
            }, [history, activeTab, activeRoutine]);

            const routines = {
                A: {
                    title: "Routine A: Massa & Spessore",
                    exercises: [
                        { id: 'lento', name: 'Lento Avanti Manubri', sets: '3x8-10', tip: 'Spalle: scendi fin sotto le orecchie.' },
                        { id: 'lat', name: 'Lat Machine Presa Larga', sets: '3x10', tip: 'Tira con i gomiti, non con le mani.' },
                        { id: 'panca', name: 'Panca Piana Manubri', sets: '3x10', tip: 'Strizza il petto in fase di risalita.' },
                        { id: 'ss1', name: 'SS: Curl EZ + French Press', sets: '4x10+10', tip: 'Nessuna pausa! Pompa quelle braccia.' },
                        { id: 'lat_man', name: 'Alzate Laterali', sets: '3x15', tip: 'Mignolo verso l alto per isolare il deltoide.' }
                    ]
                },
                B: {
                    title: "Routine B: Ampiezza & V-Shape",
                    exercises: [
                        { id: 'traz', name: 'Trazioni o Lat Stretta', sets: '3xMax/10', tip: 'Fondamentale per la V. Busto fermo.' },
                        { id: 'inc', name: 'Panca Inclinata Manubri', sets: '3x10', tip: 'Focus sulla parte alta del petto.' },
                        { id: 'ss2', name: 'SS: Hammer Curl + Pushdown', sets: '4x12+12', tip: 'Presa a martello per braccia più larghe.' },
                        { id: 'cavi', name: 'Alzate Laterali ai Cavi', sets: '3x12', tip: 'Tensione costante per spalle a palla.' },
                        { id: 'curl45', name: 'Curl Panca Inclinata 45°', sets: '2x12', tip: 'Massimo stretch del bicipite.' }
                    ]
                }
            };

            const nutrition = [
                { time: "Colazione", desc: "80g Avena + 150g Albume + Frutta" },
                { time: "Pranzo", desc: "100g Riso + 150g Pollo + 10g Olio" },
                { time: "Spuntino", desc: "Banana + 20g Mandorle" },
                { time: "Cena", desc: "120g Riso + 150g Pesce/Carne + Verdura" }
            ];

            return (
                <div className="min-h-screen pb-20 font-sans">
                    <header className="bg-indigo-600 p-6 text-white shadow-lg rounded-b-3xl">
                        <h1 className="text-2xl font-bold">Aesthetic Builder</h1>
                        <p className="opacity-80 text-sm">Target: V-Shape & Braccia</p>
                    </header>

                    <main className="p-4 max-w-md mx-auto">
                        {activeTab === 'workout' && (
                            <div className="space-y-4">
                                <div className="flex bg-white p-1 rounded-2xl shadow-sm border">
                                    <button onClick={() => setActiveRoutine('A')} className={`flex-1 py-2 rounded-xl transition ${activeRoutine === 'A' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500'}`}>Routine A</button>
                                    <button onClick={() => setActiveRoutine('B')} className={`flex-1 py-2 rounded-xl transition ${activeRoutine === 'B' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500'}`}>Routine B</button>
                                </div>
                                <h2 className="text-lg font-bold px-2 text-indigo-900">{routines[activeRoutine].title}</h2>
                                {routines[activeRoutine].exercises.map((ex) => (
                                    <div key={ex.id} className="bg-white p-4 rounded-2xl shadow-sm border flex flex-col gap-3">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h3 className="font-bold text-slate-800">{ex.name}</h3>
                                                <span className="text-indigo-600 text-sm font-semibold">{ex.sets}</span>
                                            </div>
                                            <input 
                                                type="number" 
                                                placeholder="kg"
                                                className="w-16 bg-slate-100 border-none rounded-lg p-2 text-center"
                                                value={history[ex.id] || ''}
                                                onChange={(e) => setHistory({...history, [ex.id]: e.target.value})}
                                            />
                                        </div>
                                        <div className="flex items-start gap-2 bg-indigo-50 p-3 rounded-xl">
                                            <i data-lucide="info" class="w-4 h-4 text-indigo-500 mt-1"></i>
                                            <p className="text-xs text-indigo-900 italic">{ex.tip}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'nutrition' && (
                            <div className="space-y-4">
                                <div className="bg-gradient-to-br from-green-500 to-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                                    <p className="text-xs uppercase font-bold tracking-widest">Target 31 anni / 60kg</p>
                                    <h2 className="text-2xl font-black">2400 kcal | 125g Pro</h2>
                                </div>
                                {nutrition.map((meal, i) => (
                                    <div key={i} className="bg-white p-4 rounded-2xl border flex items-center gap-4">
                                        <div className="bg-emerald-100 p-3 rounded-xl text-emerald-600">
                                            <i data-lucide="utensils" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xs text-slate-400 uppercase">{meal.time}</h4>
                                            <p className="text-slate-800 font-medium">{meal.desc}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'progress' && (
                            <div className="text-center p-10 space-y-4">
                                <div className="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-indigo-600">
                                    <i data-lucide="trending-up" class="w-8 h-8"></i>
                                </div>
                                <h2 className="text-xl font-bold">Obiettivo Luglio</h2>
                                <p className="text-slate-500">Peso Target: 64kg</p>
                                <div className="text-sm text-left bg-white p-4 rounded-xl border">
                                    <p>✅ Braccia: +2cm</p>
                                    <p>✅ Addome: Definizione V-Shape</p>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t h-16 flex items-center justify-around shadow-lg px-4">
                        <button onClick={() => setActiveTab('workout')} className={`flex flex-col items-center ${activeTab === 'workout' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <i data-lucide="dumbbell"></i>
                            <span className="text-[10px] font-bold uppercase">Workout</span>
                        </button>
                        <button onClick={() => setActiveTab('nutrition')} className={`flex flex-col items-center ${activeTab === 'nutrition' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <i data-lucide="utensils"></i>
                            <span className="text-[10px] font-bold uppercase">Dieta</span>
                        </button>
                        <button onClick={() => setActiveTab('progress')} className={`flex flex-col items-center ${activeTab === 'progress' ? 'text-indigo-600' : 'text-slate-400'}`}>
                            <i data-lucide="trending-up"></i>
                            <span className="text-[10px] font-bold uppercase">Progressi</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
