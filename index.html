<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Pro v7</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { -webkit-appearance: none; margin: 0; }
        .tab-active { background: #4f46e5; color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app">
        </div>

    <script>
        // --- DATA INITIALIZATION ---
        const defaultData = {
            routine: 'A',
            tab: 'workout',
            isEdit: false,
            workout: {
                A: {
                    name: "Routine A: Massa & Spessore",
                    warmup: "7' Tapis Roulant (Pendenza 5%) + Mobilità",
                    abs: "Leg Raises 3x15 + Plank 3x60s",
                    exs: [
                        { id: 'a1', n: 'Lento Avanti Manubri', s: '3x8-10', t: 'Focus Spalle' },
                        { id: 'a2', n: 'Lat Machine Pr. Larga', s: '3x10', t: 'Focus V-Shape' },
                        { id: 'a3', n: 'Panca Piana Manubri', s: '3x10', t: 'Focus Petto' },
                        { id: 'a4', n: 'SS: Curl EZ (Bic.)', s: '4x10', t: 'Braccia Parte 1' },
                        { id: 'a5', n: 'SS: French Press (Tri.)', s: '4x10', t: 'Braccia Parte 2' },
                        { id: 'a6', n: 'Alzate Laterali', s: '3x15', t: 'Larghezza Spalle' },
                        { id: 'a7', n: 'Facepull ai Cavi', s: '3x12', t: 'Postura & Spalla 3D' }
                    ]
                },
                B: {
                    name: "Routine B: Ampiezza & Dettaglio",
                    warmup: "7' Tapis Roulant + Circonduzioni",
                    abs: "Woodchopper 3x15 + Bicycle 3x20",
                    exs: [
                        { id: 'b1', n: 'Trazioni o Lat Stretta', s: '3xMax/10', t: 'Ampiezza Dorso' },
                        { id: 'b2', n: 'Panca Inclinata Man.', s: '3x10', t: 'Focus Petto Alto' },
                        { id: 'b3', n: 'Alzate Laterali Cavi', s: '3x12', t: 'Tensione Spalle' },
                        { id: 'b4', n: 'SS: Hammer Curl (Bic.)', s: '4x12', t: 'Spessore Braccio' },
                        { id: 'b5', n: 'SS: Pushdown Corda (Tri.)', s: '4x12', t: 'Definizione Braccio' },
                        { id: 'b6', n: 'Curl Panca Inc. 45°', s: '2x12', t: 'Picco Bicipite' },
                        { id: 'b7', n: 'Dips (Panche/Parall.)', s: '3xMax', t: 'Volume Braccia' }
                    ]
                }
            },
            weights: {},
            diet: [
                { t: "Colazione", v: [{ d: "Avena + Albume + Uovo", k: 510, p: 32 }, { d: "Yogurt Greco + Granola", k: 480, p: 30 }, { d: "Bresaola + Avocado", k: 520, p: 35 }]},
                { t: "Pranzo", v: [{ d: "Riso + Pollo + Olio", k: 680, p: 40 }, { d: "Pasta + Manzo Magro", k: 710, p: 38 }, { d: "Quinoa + Tonno + Olio", k: 650, p: 39 }]},
                { t: "Spuntino", v: [{ d: "Barretta + Mela", k: 280, p: 20 }, { d: "Parmigiano + Pera", k: 250, p: 12 }, { d: "Skyr + Mandorle", k: 270, p: 22 }]},
                { t: "Cena", v: [{ d: "Salmone + Patate", k: 650, p: 35 }, { d: "Orata + CousCous", k: 610, p: 42 }, { d: "Tacchino + Pane", k: 590, p: 38 }]}
            ]
        };

        let state = JSON.parse(localStorage.getItem('aesthetic_v7')) || defaultData;

        function save() {
            localStorage.setItem('aesthetic_v7', JSON.stringify(state));
            render();
        }

        // --- ICONS ---
        const iconGym = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 3 10l3.5 3.5m11-7L21 10l-3.5 3.5"/><path d="m18 7-11 10"/><path d="m14 7 3.5 3.5-3.5 3.5"/><path d="m6.5 6.5 3.5 3.5-3.5 3.5"/></svg>`;
        const iconFood = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`;
        const iconEdit = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2l-.2.8a1 1 0 0 1-1.2.7l-.8-.2a2 2 0 0 0-2.5 1.1l-.2.4a2 2 0 0 0 1.1 2.5l.8.2a1 1 0 0 1 .7 1.2l-.2.8a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2l.2-.8a1 1 0 0 1 1.2-.7l.8.2a2 2 0 0 0 2.5-1.1l.2-.4a2 2 0 0 0-1.1-2.5l-.8-.2a1 1 0 0 1-.7-1.2l.2-.8a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`;

        // --- RENDER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            const r = state.workout[state.routine];

            let content = `
                <header class="bg-indigo-700 p-6 text-white rounded-b-[2rem] shadow-xl sticky top-0 z-50 flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Aesthetic v7</h1>
                        <p class="text-[9px] font-bold opacity-60 uppercase tracking-widest mt-1">V-Shape Protocol • 60kg</p>
                    </div>
                    <button onclick="state.isEdit = !state.isEdit; save()" class="p-3 rounded-full ${state.isEdit ? 'bg-amber-400 shadow-lg rotate-90' : 'bg-white/10'} transition-all">
                        ${iconEdit}
                    </button>
                </header>
                <main class="p-4 max-w-md mx-auto space-y-6">
            `;

            if (state.tab === 'workout') {
                content += `
                    <div class="flex bg-white p-1 rounded-2xl shadow-inner border">
                        <button onclick="state.routine='A'; save()" class="flex-1 py-3 rounded-xl font-bold text-xs ${state.routine === 'A' ? 'tab-active' : 'text-slate-400'}">ROUTINE A</button>
                        <button onclick="state.routine='B'; save()" class="flex-1 py-3 rounded-xl font-bold text-xs ${state.routine === 'B' ? 'tab-active' : 'text-slate-400'}">ROUTINE B</button>
                    </div>

                    <div class="bg-amber-50 border border-amber-100 p-4 rounded-2xl">
                        <p class="text-[9px] font-black text-amber-600 uppercase mb-1 tracking-widest">Warmup</p>
                        ${state.isEdit ? `<input onchange="state.workout['${state.routine}'].warmup=this.value; save()" class="w-full text-xs p-2 rounded" value="${r.warmup}">` : `<p class="text-xs font-bold text-amber-900 leading-tight">${r.warmup}</p>`}
                    </div>

                    <div class="space-y-4">
                        ${r.exs.map(ex => `
                            <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm transition-all active:scale-[0.98]">
                                <div class="flex justify-between items-start gap-3">
                                    <div class="flex-1">
                                        ${state.isEdit ? `
                                            <input onchange="editEx('${ex.id}', 'n', this.value)" class="w-full font-black text-xs mb-1 p-1 border-b" value="${ex.n}">
                                            <input onchange="editEx('${ex.id}', 's', this.value)" class="w-full text-indigo-600 text-[10px] font-bold p-1 border-b" value="${ex.s}">
                                            <input onchange="editEx('${ex.id}', 't', this.value)" class="w-full text-[9px] text-slate-400 p-1" value="${ex.t}">
                                        ` : `
                                            <h4 class="font-black text-slate-800 text-sm uppercase leading-tight mb-1">${ex.n}</h4>
                                            <span class="text-indigo-600 text-[10px] font-black uppercase tracking-wider">${ex.s}</span>
                                        `}
                                    </div>
                                    ${!state.isEdit ? `
                                        <input type="number" onchange="state.weights['${ex.id}']=this.value; save()" 
                                               class="w-14 h-12 bg-slate-100 rounded-2xl text-center font-black text-indigo-600 outline-none border-2 border-transparent focus:border-indigo-500" 
                                               value="${state.weights[ex.id] || ''}" placeholder="KG">
                                    ` : ''}
                                </div>
                                ${!state.isEdit ? `<p class="mt-3 text-[10px] text-slate-400 font-bold uppercase italic leading-tight border-t pt-2">${ex.t}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-[2rem]">
                        <p class="text-[9px] font-black text-indigo-600 uppercase mb-2 tracking-widest text-center italic">Addome V-Shape</p>
                        ${state.isEdit ? `<input onchange="state.workout['${state.routine}'].abs=this.value; save()" class="w-full text-xs p-2 rounded" value="${r.abs}">` : `<p class="text-sm font-black text-indigo-900 text-center">${r.abs}</p>`}
                    </div>
                `;
            } else {
                content += `
                    <div class="bg-emerald-600 p-8 rounded-[3rem] text-white shadow-lg">
                        <p class="text-[10px] font-black opacity-70 tracking-[0.2em] mb-1 uppercase italic font-bold">Daily Fuel Target</p>
                        <h2 class="text-3xl font-black italic tracking-tighter uppercase">2400 Kcal / 125g P</h2>
                    </div>
                    ${state.diet.map(m => `
                        <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                            <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-4 border-b pb-2">${m.t}</h4>
                            <div class="space-y-3">
                                ${m.v.map(v => `
                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <p class="text-xs font-bold text-slate-700 leading-snug mb-2">${v.d}</p>
                                        <div class="flex gap-2">
                                            <span class="text-[9px] font-black bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md">${v.k} KCAL</span>
                                            <span class="text-[9px] font-black bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">P: ${v.p}G</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            }

            content += `
                </main>
                <nav class="fixed bottom-6 left-6 right-6 bg-white border border-slate-200 h-20 rounded-[2.5rem] shadow-2xl flex justify-around items-center px-4 z-[100]">
                    <button onclick="state.tab='workout'; save()" class="flex-1 flex flex-col items-center ${state.tab === 'workout' ? 'text-indigo-600' : 'text-slate-300'}">
                        ${iconGym} <span class="text-[8px] font-black uppercase mt-1">Power</span>
                    </button>
                    <button onclick="state.tab='diet'; save()" class="flex-1 flex flex-col items-center ${state.tab === 'diet' ? 'text-emerald-600' : 'text-slate-300'}">
                        ${iconFood} <span class="text-[8px] font-black uppercase mt-1">Fuel</span>
                    </button>
                </nav>
            `;

            app.innerHTML = content;
        }

        window.editEx = (id, field, val) => {
            const ex = state.workout[state.routine].exs.find(e => e.id === id);
            if (ex) ex[field] = val;
            save();
        };

        // Start
        render();
    </script>
</body>
</html>
