<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic OS v14</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"], input[type="text"] { -webkit-appearance: none; outline: none; border: none; }
        .tab-active { color: #4f46e5; border-top: 3px solid #4f46e5; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .gif-container { background: #fff; border-radius: 1.5rem; overflow: hidden; height: 220px; border: 1px solid #f1f5f9; }
        .gif-container img { width: 100%; height: 100%; object-fit: contain; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="app"></div>

    <script>
        // --- DATABASE INIZIALE ---
        const initialData = {
            routine: 'A', tab: 'power', isEdit: false,
            water: 0,
            checks: { workout: false, diet: false, supps: false },
            tasks: [
                { id: 1, txt: "Spalle aperte al PC", cat: "work", done: false },
                { id: 2, txt: "Review Mail Mattina", cat: "work", done: false }
            ],
            workout: {
                A: {
                    name: "Power & Thickness",
                    concept: "Costruiamo spessore. Carichi pesanti per una base densa.",
                    warmup: "7' Tapis (Pendenza 5%) + Mobilità Spalle",
                    abs: "Leg Raises 3x15 + Plank 3x60s",
                    exs: [
                        { id: 'a1', n: 'Lento Avanti Manubri', s: '3x8-10', t: 'Spalle Ant.', e: 'Siediti dritto. Scendi sotto le orecchie.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Shoulder-Press.gif' },
                        { id: 'a2', n: 'Lat Machine Pr. Larga', s: '3x10', t: 'V-Taper', e: 'Guida con i GOMITI. Strizza le scapole.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Lat-Pulldown.gif' },
                        { id: 'a3', n: 'Panca Piana Manubri', s: '3x10', t: 'Massa Petto', e: 'Strizza il petto in risalita.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Press.gif' },
                        { id: 'a4', n: 'SS: Curl Bilanciere EZ', s: '4x10', t: 'Bicipiti', e: 'Gomiti fermi. Spremi in alto.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Z-Bar-Curl.gif' },
                        { id: 'a5', n: 'SS: French Press EZ', s: '4x10', t: 'Tricipiti', e: 'Porta alla fronte. Gomiti stretti.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/ez-bar-lying-triceps-extension.gif' },
                        { id: 'a6', n: 'Alzate Laterali', s: '3x15', t: 'Larghezza', e: 'Mignolo in su. Isola il deltoide.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Dumbbell-Lateral-Raise.gif' },
                        { id: 'a7', n: 'Facepull ai Cavi', s: '3x12', t: 'Postura', e: 'Tira alla fronte aprendo la corda.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Face-Pull.gif' }
                    ]
                },
                B: {
                    name: "Width & Definition",
                    concept: "Focus ampiezza laterale e dettaglio braccia. Tensione costante.",
                    warmup: "7' Tapis + Mobilità elastico",
                    abs: "Woodchopper 3x15 + Bicycle 3x20",
                    exs: [
                        { id: 'b1', n: 'Trazioni / Lat Stretta', s: '3xMax/10', t: 'Dorso V', e: 'Allunga in alto. Petto alla sbarra.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Pull-up.gif' },
                        { id: 'b2', n: 'Panca Inclinata Man.', s: '3x10', t: 'Petto Alto', e: 'Inclinazione 30°. Look pieno.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Incline-Dumbbell-Press.gif' },
                        { id: 'b3', n: 'Alzate Laterali Cavi', s: '3x12', t: 'Isolamento', e: 'Cavo basso dietro schiena.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Cable-Lateral-Raise.gif' },
                        { id: 'b4', n: 'SS: Hammer Curl', s: '4x12', t: 'Brachiale', e: 'Presa a martello. Spessore braccio.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/dumbbell-hammer-curl.gif' },
                        { id: 'b5', n: 'SS: Pushdown Corda', s: '4x12', t: 'Tricep Peak', e: 'Apri corda in fondo. Strizza.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/rope-pushdown.gif' },
                        { id: 'b6', n: 'Curl Panca Inc. 45°', s: '2x12', t: 'Stretch', e: 'Braccia dietro busto. No oscillare.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/incline-dumbbell-curl.gif' },
                        { id: 'b7', n: 'Dips Panche', s: '3xMax', t: 'Finisher', e: 'Gomiti stretti. Focus tricipite.', g: 'https://www.fitnessprogramer.com/wp-content/uploads/2021/02/Bench-Dips.gif' }
                    ]
                }
            },
            weights: {},
            diet: [
                { t: "Colazione", v: [
                    { d: "80g Avena + 150g Albume + 1 Uovo", k: 515, p: 32 },
                    { d: "250g Yogurt Greco + 50g Granola + Noci", k: 490, p: 30 },
                    { d: "Poke: Riso + Pollo + Edamame + Avocado", k: 650, p: 35 },
                    { d: "Skyr (Supermercato) + 1 Barretta + Mandorle", k: 480, p: 32 },
                    { d: "30g Whey + Banana + 40g Farina Avena", k: 500, p: 30 },
                    { d: "Omelette 2 Uova + Pane Integrale (Bar)", k: 460, p: 25 }
                ]},
                { t: "Pranzo", v: [
                    { d: "100g Riso + 150g Pollo + Olio", k: 690, p: 40 },
                    { d: "100g Pasta + 150g Manzo + Olio", k: 720, p: 38 },
                    { d: "Piadina Bresaola, Rucola, Squacquerone", k: 650, p: 35 },
                    { d: "Piatto Pronto Esselunga/Conad: Pollo e Riso", k: 610, p: 32 },
                    { d: "Insalatona Ristorante: Tonno + Uova + Olio", k: 590, p: 30 },
                    { d: "Burger Tacchino (200g) + 80g Pane + Verdure", k: 640, p: 40 }
                ]}
            ],
            roadmap: [
                { m: "Aprile", t: "ADATTAMENTO", d: "Tecnica perfetta, attivazione bicipiti/tricipiti, inizio creatina." },
                { m: "Maggio", t: "OVERLOAD", d: "Aumento carichi +10%, focus larghezza spalle." },
                { m: "Giugno", t: "V-SHAPE", d: "Definizione addome basso, dieta rigorosa, vene evidenti." },
                { m: "Luglio", t: "PEAK", d: "Target 64kg, braccia massime, forma da spiaggia top." }
            ],
            blog: [
                { title: "Perché i Tricipiti?", body: "Fanno i 2/3 del braccio. Se vuoi circonferenza, spingi sulle Dips." },
                { title: "Desk-Job Hack", body: "Lavorare al PC chiude le spalle. Fai Facepull ogni sessione." }
            ]
        };

        let state = JSON.parse(localStorage.getItem('aesthetic_v14')) || initialData;
        function save() { localStorage.setItem('aesthetic_v14', JSON.stringify(state)); render(); }

        // --- ICONS ---
        const icons = {
            power: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 12h12M6 8h12M6 16h12"/></svg>`,
            fuel: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>`,
            core: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg>`,
            info: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`,
            plus: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>`
        };

        function render() {
            const app = document.getElementById('app');
            const r = state.workout[state.routine];

            let html = `
                <header class="bg-indigo-800 p-6 text-white rounded-b-[2.5rem] shadow-xl sticky top-0 z-50 glass border-b border-white/10">
                    <div class="flex justify-between items-center">
                        <h1 class="text-xl font-black italic tracking-tighter uppercase leading-none">Aesthetic OS</h1>
                        <div class="flex gap-2">
                             <div class="bg-indigo-600 px-3 py-1 rounded-full text-[9px] font-bold uppercase">60kg → 64kg</div>
                        </div>
                    </div>
                </header>
                <main class="p-4 max-w-md mx-auto space-y-6 animate-up">
            `;

            // --- TAB POWER (ALLENAMENTO) ---
            if (state.tab === 'power') {
                html += `
                    <div class="flex bg-white p-1 rounded-2xl shadow-inner border">
                        <button onclick="state.routine='A'; save()" class="flex-1 py-3 rounded-xl font-black text-[10px] tracking-widest ${state.routine === 'A' ? 'bg-indigo-600 text-white' : 'text-slate-400'} uppercase transition-all">Routine A</button>
                        <button onclick="state.routine='B'; save()" class="flex-1 py-3 rounded-xl font-black text-[10px] tracking-widest ${state.routine === 'B' ? 'bg-indigo-600 text-white' : 'text-slate-400'} uppercase transition-all">Routine B</button>
                    </div>
                    <div class="space-y-8">
                        ${r.exs.map(ex => `
                            <div class="bg-white p-2 rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden">
                                <div class="gif-container">
                                    <img src="${ex.g}" loading="lazy">
                                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg border border-indigo-100">
                                        <input type="number" onchange="state.weights['${ex.id}']=this.value; save()" 
                                               class="w-12 text-center font-black text-indigo-700 bg-transparent text-sm" 
                                               value="${state.weights[ex.id] || ''}" placeholder="KG">
                                    </div>
                                </div>
                                <div class="p-5">
                                    <h4 class="font-black text-slate-800 text-sm uppercase mb-1">${ex.n}</h4>
                                    <div class="flex items-center gap-2 mb-3">
                                        <span class="text-indigo-600 text-[10px] font-black uppercase tracking-widest">${ex.s}</span>
                                        <span class="text-slate-400 text-[9px] font-bold uppercase tracking-tighter">• ${ex.t}</span>
                                    </div>
                                    <p class="text-[10px] text-slate-500 font-medium leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">${ex.e}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // --- TAB FUEL (DIETA) ---
            else if (state.tab === 'fuel') {
                html += `
                    <div class="bg-emerald-600 p-8 rounded-[3rem] text-white shadow-xl">
                        <p class="text-[10px] font-black opacity-70 uppercase mb-1">Target</p>
                        <h2 class="text-3xl font-black italic uppercase">2400 Kcal</h2>
                    </div>
                    ${state.diet.map(m => `
                        <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                            <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-4 border-b pb-2">${m.t}</h4>
                            <div class="space-y-3">
                                ${m.v.map(v => `
                                    <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <p class="text-xs font-bold text-slate-700 mb-2 leading-snug">${v.d}</p>
                                        <div class="flex gap-2 text-[9px] font-black uppercase">
                                            <span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded">${v.k} kcal</span>
                                            <span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded">P: ${v.p}g</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                `;
            }

            // --- TAB CORE (TASKS & TRACKER) ---
            else if (state.tab === 'core') {
                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-blue-500 p-6 rounded-[2.5rem] text-white shadow-lg flex flex-col items-center">
                            <p class="text-[10px] font-black uppercase opacity-70 mb-2">Water (3L)</p>
                            <h2 class="text-3xl font-black">${(state.water * 0.25).toFixed(1)}L</h2>
                            <button onclick="state.water++; save()" class="mt-4 bg-white/20 p-3 rounded-full hover:bg-white/40 transition">
                                ${icons.plus}
                            </button>
                        </div>
                        <div class="bg-indigo-600 p-6 rounded-[2.5rem] text-white shadow-lg flex flex-col justify-between">
                            <p class="text-[10px] font-black uppercase opacity-70 mb-2">Check-in</p>
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 text-[10px] font-bold"><input type="checkbox" ${state.checks.workout ? 'checked' : ''} onclick="state.checks.workout=!state.checks.workout; save()"> Gym</label>
                                <label class="flex items-center gap-2 text-[10px] font-bold"><input type="checkbox" ${state.checks.diet ? 'checked' : ''} onclick="state.checks.diet=!state.checks.diet; save()"> Diet</label>
                                <label class="flex items-center gap-2 text-[10px] font-bold"><input type="checkbox" ${state.checks.supps ? 'checked' : ''} onclick="state.checks.supps=!state.checks.supps; save()"> Supps</label>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-7 rounded-[3rem] border border-slate-100 shadow-sm">
                        <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest mb-6">Aesthetic Tasks</h4>
                        <div class="space-y-4">
                            ${state.tasks.map(t => `
                                <div class="flex items-center gap-4 group">
                                    <input type="checkbox" ${t.done ? 'checked' : ''} onclick="t.done=!t.done; save()" class="w-6 h-6 rounded-full border-2 border-indigo-200 checked:bg-indigo-600 transition-all">
                                    <span class="text-xs font-bold ${t.done ? 'line-through text-slate-300' : 'text-slate-700'} uppercase tracking-tighter">${t.txt}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // --- TAB INFO (BLOG & ROADMAP) ---
            else if (state.tab === 'info') {
                html += `
                    <div class="bg-indigo-900 p-8 rounded-[3rem] text-white shadow-2xl">
                        <h2 class="text-2xl font-black italic tracking-tighter uppercase mb-6">Roadmap 2026</h2>
                        <div class="space-y-6">
                            ${state.roadmap.map(item => `
                                <div class="flex gap-4">
                                    <div class="text-indigo-400 font-black text-sm uppercase">${item.m}</div>
                                    <div class="flex-1 border-l-2 border-indigo-700 pl-4">
                                        <p class="text-xs font-black text-white uppercase">${item.t}</p>
                                        <p class="text-[10px] text-indigo-200 mt-1">${item.d}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="space-y-4">
                        <h4 class="text-[10px] font-black text-slate-300 uppercase tracking-widest px-4">Expert Blog</h4>
                        ${state.blog.map(post => `
                            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                                <h5 class="font-black text-slate-800 text-xs uppercase mb-2">${post.title}</h5>
                                <p class="text-[10px] text-slate-500 font-medium leading-relaxed">${post.body}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            html += `
                </main>
                <nav class="fixed bottom-0 left-0 right-0 h-24 glass border-t border-slate-200 flex justify-around items-center px-4 z-[100] rounded-t-[2.5rem]">
                    <button onclick="state.tab='power'; save()" class="flex flex-col items-center gap-1 ${state.tab === 'power' ? 'text-indigo-600' : 'text-slate-400'}">
                        ${icons.power} <span class="text-[8px] font-black uppercase">Power</span>
                    </button>
                    <button onclick="state.tab='fuel'; save()" class="flex flex-col items-center gap-1 ${state.tab === 'fuel' ? 'text-emerald-600' : 'text-slate-400'}">
                        ${icons.fuel} <span class="text-[8px] font-black uppercase">Fuel</span>
                    </button>
                    <button onclick="state.tab='core'; save()" class="flex flex-col items-center gap-1 ${state.tab === 'core' ? 'text-indigo-600' : 'text-slate-400'}">
                        ${icons.core} <span class="text-[8px] font-black uppercase">Core</span>
                    </button>
                    <button onclick="state.tab='info'; save()" class="flex flex-col items-center gap-1 ${state.tab === 'info' ? 'text-indigo-600' : 'text-slate-400'}">
                        ${icons.info} <span class="text-[8px] font-black uppercase">Info</span>
                    </button>
                </nav>
            `;

            app.innerHTML = html;
        }

        render();
    </script>
</body>
</html>
